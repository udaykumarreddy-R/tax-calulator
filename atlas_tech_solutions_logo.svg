<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7931e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main Globe Circle -->
  <circle cx="200" cy="140" r="90" fill="url(#globeGradient)" opacity="0.9"/>

  <!-- Globe Grid Lines (latitude) -->
  <circle cx="200" cy="140" r="90" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <ellipse cx="200" cy="140" rx="90" ry="45" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <ellipse cx="200" cy="140" rx="90" ry="22.5" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>

  <!-- Globe Grid Lines (longitude) -->
  <line x1="200" y1="50" x2="200" y2="230" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <line x1="200" y1="50" x2="200" y2="230" stroke="white" stroke-width="1.5" opacity="0.3" transform="rotate(45 200 140)"/>
  <line x1="200" y1="50" x2="200" y2="230" stroke="white" stroke-width="1.5" opacity="0.3" transform="rotate(90 200 140)"/>
  <line x1="200" y1="50" x2="200" y2="230" stroke="white" stroke-width="1.5" opacity="0.3" transform="rotate(-45 200 140)"/>

  <!-- Tech Circuit Elements on Globe -->
  <circle cx="200" cy="90" r="4" fill="url(#accentGradient)"/>
  <circle cx="250" cy="140" r="4" fill="url(#accentGradient)"/>
  <circle cx="150" cy="160" r="4" fill="url(#accentGradient)"/>

  <!-- Circuit Connections -->
  <line x1="200" y1="90" x2="250" y2="140" stroke="url(#accentGradient)" stroke-width="2" opacity="0.8"/>
  <line x1="250" y1="140" x2="150" y2="160" stroke="url(#accentGradient)" stroke-width="2" opacity="0.8"/>
  <line x1="150" y1="160" x2="200" y2="90" stroke="url(#accentGradient)" stroke-width="2" opacity="0.8"/>

  <!-- Globe Shine/Highlight -->
  <ellipse cx="170" cy="110" rx="25" ry="35" fill="white" opacity="0.15"/>

  <!-- Tech nodes positioned around globe -->
  <g opacity="0.7">
    <circle cx="280" cy="80" r="3" fill="url(#accentGradient)"/>
    <circle cx="300" cy="140" r="3" fill="url(#accentGradient)"/>
    <circle cx="120" cy="200" r="3" fill="url(#accentGradient)"/>
    <line x1="280" y1="80" x2="250" y2="140" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6"/>
    <line x1="300" y1="140" x2="250" y2="140" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Company Name -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#003366">
    ATLAS
  </text>
  <text x="200" y="310" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#0066ff" letter-spacing="3">
    TECH SOLUTIONS
  </text>

  <!-- Accent line under text -->
  <line x1="80" y1="325" x2="320" y2="325" stroke="url(#accentGradient)" stroke-width="3" opacity="0.8"/>
</svg>